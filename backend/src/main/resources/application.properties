spring.application.name=job-tracker

# Database (override with environment variables in Docker / AWS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (the secret must be at least 32 characters; always override in production)
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=86400000

# Allowed frontend origins, comma separated
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
