# Starts PostgreSQL and the Spring Boot API.  Run the React app separately with `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/jobtracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: replace-this-with-a-long-random-string-of-32-plus-characters
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  pgdata:
